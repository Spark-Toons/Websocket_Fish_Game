<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Input</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, textarea, button { box-sizing: border-box; font: inherit; padding: .65rem; }
    input, textarea { width: 100%; border: 1px solid #aab3c2; border-radius: 6px; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin: 1rem .5rem 0 0; border: 0; border-radius: 6px; background: #2457d6; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 1.5em; color: #46536a; }
  </style>
</head>
<body>
  <h1>WebSocket Input</h1>
  <p>Connect to a WebSocket server and send it a message.</p>

  <form id="connection-form">
    <label for="url">WebSocket server URL</label>
    <input id="url" type="url" value="ws://localhost:8080" required>
    <button id="connect" type="submit">Connect</button>
    <button id="disconnect" type="button" disabled>Disconnect</button>
  </form>

  <p id="status" role="status" aria-live="polite">Not connected</p>

  <form id="message-form">
    <label for="message">Message</label>
    <textarea id="message" required placeholder="Type a message..."></textarea>
    <button id="send" type="submit" disabled>Send message</button>
  </form>

  <script>
    const connectionForm = document.querySelector("#connection-form");
    const messageForm = document.querySelector("#message-form");
    const urlInput = document.querySelector("#url");
    const messageInput = document.querySelector("#message");
    const status = document.querySelector("#status");
    const connectButton = document.querySelector("#connect");
    const disconnectButton = document.querySelector("#disconnect");
    const sendButton = document.querySelector("#send");
    let socket;

    function setConnected(connected) {
      connectButton.disabled = connected;
      disconnectButton.disabled = !connected;
      sendButton.disabled = !connected;
    }

    connectionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (socket && socket.readyState < WebSocket.CLOSING) return;

      try {
        socket = new WebSocket(urlInput.value);
      } catch (error) {
        status.textContent = `Could not connect: ${error.message}`;
        return;
      }

      status.textContent = "Connecting...";
      socket.addEventListener("open", () => {
        status.textContent = "Connected";
        setConnected(true);
      });
      socket.addEventListener("close", () => {
        status.textContent = "Disconnected";
        setConnected(false);
      });
      socket.addEventListener("error", () => {
        status.textContent = "WebSocket error. Check the URL and server.";
      });
    });

    disconnectButton.addEventListener("click", () => {
      if (socket) socket.close();
    });

    messageForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(messageInput.value);
      messageInput.value = "";
      messageInput.focus();
    });
  </script>
</body>
</html>
