<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Output</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input, button { box-sizing: border-box; font: inherit; padding: .65rem; }
    input { width: 100%; border: 1px solid #aab3c2; border-radius: 6px; }
    button { margin: 1rem .5rem 0 0; border: 0; border-radius: 6px; background: #2457d6; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #status { min-height: 1.5em; color: #46536a; }
    #messages { padding-left: 1.5rem; }
    #messages li { margin: .5rem 0; overflow-wrap: anywhere; }
    .message-time { color: #68758a; font-size: .85em; margin-right: .5rem; }
  </style>
</head>
<body>
  <h1>WebSocket Output</h1>
  <p>Connect to the same WebSocket server as the input page to see incoming messages.</p>

  <form id="connection-form">
    <label for="url">WebSocket server URL</label>
    <input id="url" type="url" value="ws://localhost:8080" required>
    <button id="connect" type="submit">Connect</button>
    <button id="disconnect" type="button" disabled>Disconnect</button>
    <button id="clear" type="button">Clear messages</button>
  </form>

  <p id="status" role="status" aria-live="polite">Not connected</p>
  <h2>Received messages</h2>
  <ol id="messages" aria-live="polite"></ol>

  <script>
    const connectionForm = document.querySelector("#connection-form");
    const urlInput = document.querySelector("#url");
    const status = document.querySelector("#status");
    const connectButton = document.querySelector("#connect");
    const disconnectButton = document.querySelector("#disconnect");
    const messages = document.querySelector("#messages");
    let socket;

    function setConnected(connected) {
      connectButton.disabled = connected;
      disconnectButton.disabled = !connected;
    }

    connectionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      if (socket && socket.readyState < WebSocket.CLOSING) return;

      try {
        socket = new WebSocket(urlInput.value);
      } catch (error) {
        status.textContent = `Could not connect: ${error.message}`;
        return;
      }

      status.textContent = "Connecting...";
      socket.addEventListener("open", () => {
        status.textContent = "Connected; waiting for messages...";
        setConnected(true);
      });
      socket.addEventListener("message", (event) => {
        const item = document.createElement("li");
        const time = document.createElement("time");
        time.className = "message-time";
        time.dateTime = new Date().toISOString();
        time.textContent = new Date().toLocaleTimeString();
        item.append(time, document.createTextNode(String(event.data)));
        messages.append(item);
      });
      socket.addEventListener("close", () => {
        status.textContent = "Disconnected";
        setConnected(false);
      });
      socket.addEventListener("error", () => {
        status.textContent = "WebSocket error. Check the URL and server.";
      });
    });

    disconnectButton.addEventListener("click", () => {
      if (socket) socket.close();
    });

    document.querySelector("#clear").addEventListener("click", () => {
      messages.replaceChildren();
    });
  </script>
</body>
</html>
